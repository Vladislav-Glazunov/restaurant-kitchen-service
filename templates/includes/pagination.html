{% load query_transform %}
{% if is_paginated %}
  <ul class="pagination justify-content-center">
    {% if page_obj.has_previous %}
      <li class="page-item">
        <a href="?{% query_transform request page=page_obj.previous_page_number %}" class="page-link">&laquo;</a>
      </li>
    {% endif %}
    {% for num_page in paginator.page_range %}
      <li class="page-item {% if num_page == page_obj.number %}active{% endif %}">
        <a class="page-link" href="?{% query_transform request page=num_page %}">{{ num_page }}</a>
      </li>
    {% endfor %}
    {% if page_obj.has_next %}
      <li class="page-item">
        <a href="?{% query_transform request page=page_obj.next_page_number %}" class="page-link">&raquo;</a>
      </li>
    {% endif %}
  </ul>
{% endif %}
